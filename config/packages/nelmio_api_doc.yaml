nelmio_api_doc:
    documentation:
        info:
            title: Credit Issuance API
            description: API для создания клиентов и выдачи кредитов
            version: 1.0.0
        servers:
            - url: '%env(resolve:APP_API_URL)%'
    areas: # to filter documented areas
        path_patterns:
            - ^/api(?!/doc$) # Accepts routes under /api except /api/doc
