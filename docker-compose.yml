services:
  php:
    build: .
    container_name: loan_api_php
    volumes:
      - ./:/var/www/html
    ports:
      - '9000:9000'
    environment:
      - APP_ENV=prod

  nginx:
    image: nginx:alpine
    container_name: loan_api_nginx
    ports:
      - '80:80'
    volumes:
      - ./:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php
